<!DOCTYPE html>
<html>
<head>
  <title></title>
</head>
<body>

<!--
1) <label> გამოიყენება input-ის აღწერისთვის
2) დაკავშირება: label for = input id
3) input ტიპები:text,email,password,number
4) submit:
   input type="submit" → სტანდარტული
   button → უფრო მოქნილი
5) ყველა input-ს უნდა ჰქონდეს label
-->

    <h2 id="home">Home</h2>
    <p></p>

    <h2 id="login">Login Form</h2>
        <form>
            <label for="loginEmail">Email:</label><br>
            <input type="email" id="loginEmail"><br><br>

            <label for="loginPassword">Password:</label><br>
            <input type="password" id="loginPassword"><br><br>

            <input type="submit" value="Login">
            <button type="submit">Custom Login</button>
        </form>


<!-- ================= REGISTER ================= -->
<h2 id="register">Register Form</h2>
<form>
  <label for="name">Name:</label><br>
  <input type="text" id="name"><br><br>

  <label for="lastname">Last Name:</label><br>
  <input type="text" id="lastname"><br><br>

  <label for="age">Age:</label><br>
  <input type="number" id="age"><br><br>

  <label for="email">Email:</label><br>
  <input type="email" id="email"><br><br>

  <label for="password">Password:</label><br>
  <input type="password" id="password"><br><br>

  <button type="submit">Register</button>
</form>

</body>
</html>
